# Enterprise Portal v2 links docs content to a Replicated release ONLY when a git
# branch in the docs repo is named EXACTLY the bare release version label (e.g.
# `0.3.312`). See .github/workflows/epv2-reconcile-content-branches/README.md for
# the rule and the vandoor reference. This reusable workflow keeps those branches
# in sync with the releases on the active channels so new releases stop 404-ing in
# the portal.
name: EPv2 Reconcile Content Branches

on:
  workflow_call:
    inputs:
      app_slug:
        description: "Replicated app slug (or name/id) whose releases drive the content branches"
        required: true
        type: string
      channels:
        description: "Comma-separated active channels to reconcile"
        required: false
        type: string
        default: "Stable,Beta,Unstable"
      release_limit:
        description: "Max releases to consider per channel (bounds the branch set)"
        required: false
        type: number
        default: 20
      base_branch:
        description: "Branch new content branches are created off of"
        required: false
        type: string
        default: main
      dry_run:
        description: "Log the plan without creating any branches"
        required: false
        type: boolean
        default: false
      workflow_ref:
        description: "Ref of replicatedhq/reusable-workflows to fetch the reconcile script from. Pin this to the same ref you call the workflow at."
        required: false
        type: string
        default: main
    secrets:
      replicated_api_token:
        description: "Replicated vendor API token (read access to apps, channels, releases)"
        required: true

# The caller must grant `permissions: contents: write` on the calling job so the
# workflow can create refs in the caller's docs repo. Nothing else is needed.
jobs:
  reconcile:
    name: Reconcile content branches
    runs-on: ubuntu-22.04
    steps:
      # The caller's repo is the docs repo we create branches in; check it out so
      # GITHUB_REPOSITORY and the default GITHUB_TOKEN target the right repo.
      - name: Checkout caller repo
        uses: actions/checkout@v4

      # The caller does not have the reconcile script, so fetch it (plus its unit
      # tests) from this workflow's own repo at the pinned ref.
      - name: Fetch reconcile script
        uses: actions/checkout@v4
        with:
          repository: replicatedhq/reusable-workflows
          ref: ${{ inputs.workflow_ref }}
          path: .epv2-reusable-workflow
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The branch-name rule is the EP v2 contract; prove it holds before we touch
      # any refs. Standard-library only, so no pip install.
      - name: Run unit tests
        working-directory: .epv2-reusable-workflow
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Reconcile content branches
        env:
          REPLICATED_APP: ${{ inputs.app_slug }}
          REPLICATED_API_TOKEN: ${{ secrets.replicated_api_token }}
          # Provided automatically by Actions; used to create refs in the caller's repo.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          CHANNELS: ${{ inputs.channels }}
          RELEASE_LIMIT: ${{ inputs.release_limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .epv2-reusable-workflow/scripts/epv2_reconcile_content_branches.py
